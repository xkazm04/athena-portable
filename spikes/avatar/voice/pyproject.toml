[project]
name = "avatar-voice"
version = "0.1.0"
description = "WP-L: Kokoro af_heart lines -> WAV + phoneme/viseme timeline (avatar spike)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "onnx>=1.16",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avatar_voice"]
