[package]
name = "athena-desktop"
version = "0.1.0"
description = "Athena — the shell: one window, a module bar, and a page webview per tab"
authors = ["Athena Portable contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80.0"
publish = false

[lib]
name = "athena_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what puts several webviews in one window, which is the whole shape of this shell
# (README section 3.1): one chrome webview and one page webview per tab, positioned by
# `layout.rs`. It is a Tauri feature flag, not a nightly toolchain flag — the crate builds on
# stable rustc. README section 9's first risk row is about this API surface, and c18 is where it
# is retired.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shell's own store (c21). `bundled` compiles SQLite's amalgamation into the binary rather
# than linking whatever the machine happens to have: the store is one file in the app data
# directory and a bundle that installs on a machine with no SQLite is the whole point of
# freezing the daemon beside it.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.dev]
incremental = true
