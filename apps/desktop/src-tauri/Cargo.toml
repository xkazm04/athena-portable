[package]
name = "athena-desktop"
version = "0.1.0"
description = "Athena — the shell: one window, a module bar, and a page webview per tab"
authors = ["Athena Portable contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80.0"
publish = false

[lib]
name = "athena_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what puts several webviews in one window, which is the whole shape of this shell
# (README section 3.1): one chrome webview and one page webview per tab, positioned by
# `layout.rs`. It is a Tauri feature flag, not a nightly toolchain flag — the crate builds on
# stable rustc. README section 9's first risk row is about this API surface, and c18 is where it
# is retired.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The relay (c19) parks a request on a oneshot and gives up on it with a timer. Tauri already runs
# on tokio; these two features are what make its channel and its clock ours to name directly.
tokio = { version = "1", features = ["sync", "time"] }
# 128 bits from the OS for the per-tab nonce and the tail of every request id. `rand` would be a
# generator, a distribution and a trait we do not need for `fill`. The daemon token (c20) is 32
# bytes from the same source: a guessable token is an open daemon (ADR 0015).
getrandom = "0.3"

[dev-dependencies]
# `#[tokio::test]`: the relay's timer and its id map are asserted without a window.
tokio = { version = "1", features = ["macros", "rt"] }

# Exit hygiene (c20, README section 3.5). The job object with `KILL_ON_JOB_CLOSE` is what makes a
# hard kill of the shell take the daemon with it; there is no portable API for that, so this is
# the one Windows-only dependency in the crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # `CreateJobObjectW` takes a `SECURITY_ATTRIBUTES *`, so the job object API is gated on it.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.dev]
incremental = true
