# The gate of README §7, run on every push and pull request. A gate nobody runs is a suggestion.
name: gate

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the environment
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        # No provider, no browser, no Rust toolchain: the whole suite runs here.
        run: uv run pytest

  javascript:
    name: javascript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Every script iterates the workspaces with --if-present, so these pass while
      # packages/ and apps/ are still empty and start asserting the moment they are not.
      # From c18 that is the bridge *and* the desktop shell: `apps/desktop` declares all three
      # scripts, so its tsc, its eslint and its vitest run here without a line of their own.
      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: test
        # Not the root script: `pnpm test` iterates every workspace, and @athena/journey is a
        # browser end-to-end suite that boots four servers and wants a Chromium this runner does
        # not install. It is run by hand before a demo. Everything else runs here: the bridge,
        # the panel's vitest, the kit and the three apps. The panel's `test:e2e` is its own
        # script because it spawns the Python daemon, which this job has no environment for;
        # the daemon's own end-to-end suite runs in the python job, under pytest.
        run: pnpm -r --if-present --filter '!@athena/journey' run test

  rust:
    name: rust shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2's Linux prerequisites. The shell is developed on Windows against WebView2 and
      # checked here against WebKitGTK, which is the cheap way to keep a platform-specific API
      # from reaching main unnoticed.
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `generate_context!` embeds `frontendDist`, so a missing `dist/` is a compile error rather
      # than a runtime one. Building the bundle first is what makes `cargo check` mean anything.
      - name: Build the frontend bundle
        run: pnpm --filter athena-desktop build

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test
